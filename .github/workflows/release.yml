name: Build Desktop Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create draft release if needed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Reader $GITHUB_REF_NAME" \
              --generate-notes
          fi

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-latest
            platform: macos
            arch: universal
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Verify release metadata
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/check-release-metadata.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run

      - name: Test Rust core
        run: cargo test --locked --lib -j 4

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop
        env:
          CARGO_BUILD_JOBS: 4
        run: npx tauri build --ci --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" -- --locked

      - name: Collect release artifacts
        env:
          TAURI_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node scripts/collect-desktop-artifacts.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reader-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: Upload platform files to draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
